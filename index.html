
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة درجات الطلاب</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        /* ===== Header ===== */

        header {
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }

        /* ===== Main ===== */

        main {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        /* ===== Statistics ===== */

        .statistics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card .icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .stat-card h2 {
            font-size: 28px;
            color: #2563eb;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #6b7280;
        }

        /* ===== Students Section ===== */

        .students-section {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title h2 {
            font-size: 23px;
        }

        .student-count {
            background: #eff6ff;
            color: #2563eb;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* ===== Students Grid ===== */

        .students {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        /* ===== Student Card ===== */

        .student {
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.3s;
            background: #ffffff;
        }

        .student:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-color: #93c5fd;
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* ===== Avatar ===== */

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .student-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .student-label {
            color: #9ca3af;
            font-size: 13px;
        }

        /* ===== Grade ===== */

        .grade-box {
            text-align: center;
        }

        .grade {
            font-size: 22px;
            font-weight: bold;
        }

        .grade-label {
            font-size: 12px;
            color: #9ca3af;
        }

        /* درجات مختلفة */

        .excellent {
            color: #16a34a;
        }

        .good {
            color: #2563eb;
        }

        .average {
            color: #f59e0b;
        }

        .low {
            color: #dc2626;
        }

        /* ===== Footer ===== */

        footer {
            text-align: center;
            padding: 30px;
            color: #9ca3af;
            font-size: 14px;
        }

        /* ===== Responsive ===== */

        @media (max-width: 768px) {

            .statistics {
                grid-template-columns: 1fr;
            }

            .students {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 26px;
            }

        }

    </style>
</head>


<body>

    <!-- Header -->

    <header>

        <h1>📚 لوحة درجات الطلاب</h1>

        <p>
            عرض بيانات الطلاب ودرجاتهم بطريقة منظمة
        </p>

    </header>


    <main>

        <!-- الإحصائيات -->

        <section class="statistics">

            <div class="stat-card">

                <div class="icon">👨‍🎓</div>

                <h2 id="studentCount">
                    0
                </h2>

                <p>
                    عدد الطلاب
                </p>

            </div>


            <div class="stat-card">

                <div class="icon">📊</div>

                <h2 id="averageGrade">
                    0
                </h2>

                <p>
                    متوسط الدرجات
                </p>

            </div>


            <div class="stat-card">

                <div class="icon">🏆</div>

                <h2 id="highestGrade">
                    0
                </h2>

                <p>
                    أعلى درجة
                </p>

            </div>

        </section>


        <!-- قائمة الطلاب -->

        <section class="students-section">

            <div class="section-title">

                <h2>
                    قائمة الطلاب
                </h2>

                <span class="student-count" id="countText">
                    0 طلاب
                </span>

            </div>


            <div
                class="students"
                id="students">
            </div>

        </section>

    </main>


    <footer>

        نظام إدارة درجات الطلاب © 2026

    </footer>



    <script>

        // =====================================
        // المصفوفة التي تحتوي على Objects
        // =====================================

        let students = [

            {
                name: "أحمد محمد",
                grade: 95
            },

            {
                name: "محمد علي",
                grade: 88
            },

            {
                name: "خالد عبدالله",
                grade: 76
            },

            {
                name: "سعيد أحمد",
                grade: 92
            },

            {
                name: "علي حسن",
                grade: 68
            },

            {
                name: "عبدالله سالم",
                grade: 84
            }

        ];



        // =====================================
        // الحصول على عناصر HTML
        // =====================================

        let studentsContainer =
            document.getElementById("students");

        let studentCount =
            document.getElementById("studentCount");

        let countText =
            document.getElementById("countText");

        let averageGrade =
            document.getElementById("averageGrade");

        let highestGrade =
            document.getElementById("highestGrade");



        // =====================================
        // عدد الطلاب
        // =====================================

        studentCount.textContent =
            students.length;

        countText.textContent =
            students.length + " طلاب";



        // =====================================
        // حساب مجموع الدرجات
        // =====================================

        let total = 0;

        students.forEach(function(student) {

            total += student.grade;

        });



        // =====================================
        // حساب المتوسط
        // =====================================

        let average =
            total / students.length;

        averageGrade.textContent =
            average.toFixed(1);



        // =====================================
        // أعلى درجة
        // =====================================

        let highest = students[0].grade;

        students.forEach(function(student) {

            if (student.grade > highest) {

                highest = student.grade;

            }

        });

        highestGrade.textContent =
            highest;



        // =====================================
        // عرض الطلاب
        // =====================================

        students.forEach(function(student) {


            // إنشاء بطاقة الطالب

            let div =
                document.createElement("div");


            div.className =
                "student";



            // =================================
            // تحديد لون الدرجة
            // =================================

            let gradeClass;


            if (student.grade >= 90) {

                gradeClass = "excellent";

            }

            else if (student.grade >= 80) {

                gradeClass = "good";

            }

            else if (student.grade >= 70) {

                gradeClass = "average";

            }

            else {

                gradeClass = "low";

            }



            // =================================
            // الحرف الأول من اسم الطالب
            // =================================

            let firstLetter =
                student.name.charAt(0);



            // =================================
            // محتوى البطاقة
            // =================================

            div.innerHTML = `

                <div class="student-info">

                    <div class="avatar">
                        ${firstLetter}
                    </div>

                    <div>

                        <div class="student-name">
                            ${student.name}
                        </div>

                        <div class="student-label">
                            طالب
                        </div>

                    </div>

                </div>


                <div class="grade-box">

                    <div class="grade ${gradeClass}">
                        ${student.grade}
                    </div>

                    <div class="grade-label">
                        الدرجة
                    </div>

                </div>

            `;



            // إضافة البطاقة للصفحة

            studentsContainer.appendChild(div);

        });

    </script>

</body>
</html>
